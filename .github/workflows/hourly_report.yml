name: Hourly Token Report

on:
  schedule:
    # 这里的 0 * * * * 表示每小时的 0 分触发（注意：Action 可能有几分钟延迟）
    - cron: '0 * * * *'
  workflow_dispatch: # 允许你在 GitHub 页面手动点击运行进行测试

jobs:
  run_summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python feishu_summary.py

      - name: Commit Last Update Time
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_time.txt
          git commit -m "update: last seen timestamp" || echo "No changes to commit"
          git push
